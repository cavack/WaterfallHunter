name: Change request
description: Propose a scoped product, engineering, research, operational, or documentation change.
title: "change: "
body:
  - type: markdown
    attributes:
      value: "Threshold, gate, or decision-policy promotion requires documented scientific evidence. Live order execution is outside the supported runtime boundary."
  - type: textarea
    id: problem
    attributes:
      label: Problem or research question
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Describe what should change and what should remain unchanged.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: Tests, runtime measurements, replay/holdout evidence, or documentation checks required before acceptance.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and rollback considerations
    validations:
      required: true
