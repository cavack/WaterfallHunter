server {
    listen 80;
    server_name waterfall.booksreadlive.online;

    # The dashboard exposes trade plans, evidence and the decision settings
    # panel. None of it should be world-readable. Credentials live in
    # /etc/nginx/.htpasswd-waterfallhunter (created with htpasswd -c).
    auth_basic "WaterfallHunter";
    auth_basic_user_file /etc/nginx/.htpasswd-waterfallhunter;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # Server-sent events. Without disabling buffering nginx holds the stream
    # until its buffer fills, the browser sees no heartbeat for >45s, and the
    # dashboard oscillates between "Live" and "Reconnecting" while showing
    # stale data. The long read timeout matches the 15s heartbeat with margin.
    location /dashboard/api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Health endpoints stay open so external monitoring does not need
    # credentials; they expose no candidate or plan data.
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location = /livez {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location = /readyz {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
