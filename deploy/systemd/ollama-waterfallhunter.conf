[Service]
# WaterfallHunter's advisory is a short JSON classification on an 8-core,
# CPU-only host. Four 4K-context slots turn a 1.5B model into four competing
# inference jobs, consume ~5.7GiB, and let FORMING traffic starve the one
# actionable ENTRY_READY advisory. One slot and a 2K context trade peak
# throughput for bounded latency and predictable memory.
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_CONTEXT_LENGTH=2048
Environment=OLLAMA_MAX_LOADED_MODELS=1
Environment=OLLAMA_KEEP_ALIVE=10m
